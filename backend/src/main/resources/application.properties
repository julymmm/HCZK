server.port=${SERVER_PORT:8081}
spring.application.name=astraforge-backend
spring.config.import=optional:file:./application-local.properties

# 数据库连接。真实账号密码请放在环境变量或 backend/application-local.properties 中。
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hic}?useSSL=false&serverTimezone=UTC&characterEncoding=utf-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.mapper-locations=classpath*:com/example/backend/mapper/*.xml
mybatis.type-handlers-package=com.example.backend.infrastructure.config

# 文件上传限制。当前项目使用 OSS 存储，后端只负责签名上传与文件元数据处理。
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=60MB
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JWT 双令牌认证。
# access token 默认 20 分钟，refresh token 默认 10 天。
# 生产环境必须配置固定 RSA 私钥和公钥，不能把真实密钥提交到仓库。
app.jwt.private-key=${JWT_PRIVATE_KEY:}
app.jwt.public-key=${JWT_PUBLIC_KEY:}
app.jwt.access-expire-minutes=${JWT_ACCESS_EXPIRE_MINUTES:20}
app.jwt.refresh-expire-minutes=${JWT_REFRESH_EXPIRE_MINUTES:14400}
app.hic.auth.key=${AUTH_KEY:}

# 验证码与密码策略。验证码、发送频控和 refresh token 白名单依赖 Redis。
app.auth.verification.code-length=${AUTH_CODE_LENGTH:6}
app.auth.verification.ttl=${AUTH_CODE_TTL:5m}
app.auth.verification.max-attempts=${AUTH_CODE_MAX_ATTEMPTS:5}
app.auth.verification.send-interval=${AUTH_CODE_SEND_INTERVAL:60s}
app.auth.verification.daily-limit=${AUTH_CODE_DAILY_LIMIT:10}
app.auth.verification.expose-code-in-response=${AUTH_CODE_EXPOSE:false}
app.auth.verification.sender=${AUTH_CODE_SENDER:log}
app.auth.password.min-length=${AUTH_PASSWORD_MIN_LENGTH:8}

# Redis 缓存与会话层。Redis 是验证码、限流计数和 refresh token 白名单的必需组件。
app.redis.enabled=${REDIS_ENABLED:true}
app.redis.key-prefix=${REDIS_KEY_PREFIX:hczk}
app.redis.cache-ttl=${REDIS_CACHE_TTL:30m}
app.redis.detail-ttl=${REDIS_DETAIL_TTL:30m}
app.redis.null-ttl=${REDIS_NULL_TTL:60s}
app.redis.ttl-jitter=${REDIS_TTL_JITTER:5m}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.cache.type=${CACHE_TYPE:simple}

# 邮箱验证码发送配置。QQ 邮箱可使用 smtp.qq.com + 授权码。
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# 阿里云 OSS 对象存储。文件按 oss.folder/业务模块/日期/文件名 分类保存。
oss.enabled=${OSS_ENABLED:false}
oss.endpoint=${OSS_ENDPOINT:}
oss.bucket=${OSS_BUCKET:}
oss.access-key-id=${OSS_ACCESS_KEY_ID:}
oss.access-key-secret=${OSS_ACCESS_KEY_SECRET:}
oss.public-domain=${OSS_PUBLIC_DOMAIN:}
oss.folder=${OSS_FOLDER:hczk}

# Kafka 异步内容事件。远程 Kafka 地址通过 KAFKA_BOOTSTRAP_SERVERS 注入。
app.kafka.enabled=${KAFKA_ENABLED:true}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.backend.share.event
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.listener.auto-startup=${KAFKA_ENABLED:true}

# Elasticsearch 搜索。真实 ES 地址、账号和密码通过环境变量或本地配置注入。
search.enabled=${SEARCH_ENABLED:true}
search.elasticsearch.uris=${SEARCH_ELASTICSEARCH_URIS:http://localhost:9200}
search.elasticsearch.username=${SEARCH_ELASTICSEARCH_USERNAME:}
search.elasticsearch.password=${SEARCH_ELASTICSEARCH_PASSWORD:}
search.index.content=${SEARCH_INDEX_CONTENT:hczk_content_index}

# AI 摘要与 RAG。DeepSeek 走 OpenAI-compatible 协议，因此使用 Spring AI 标准 spring.ai.openai.* 配置。
app.ai.enabled=${APP_AI_ENABLED:false}
app.ai.summary.cache-ttl=${APP_AI_SUMMARY_CACHE_TTL:7d}
app.ai.rag.index-name=${APP_AI_RAG_INDEX_NAME:hczk_share_rag_index}
app.ai.rag.top-k=${APP_AI_RAG_TOP_K:5}
app.ai.rag.max-tokens=${APP_AI_RAG_MAX_TOKENS:1024}
spring.ai.openai.api-key=${SPRING_AI_OPENAI_API_KEY:}
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://api.deepseek.com}
spring.ai.openai.chat.options.model=${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:deepseek-chat}

# 问答积分。
app.qna.points.accepted=${QNA_POINTS_ACCEPTED:10}
app.qna.points.like-threshold=${QNA_POINTS_LIKE_THRESHOLD:5}
app.qna.points.like-reward=${QNA_POINTS_LIKE_REWARD:2}

# 运行时安全、日志和监控。
server.error.include-stacktrace=never
server.error.include-message=never
logging.level.root=WARN
logging.level.com.example.backend=INFO
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
spring.jackson.default-property-inclusion=NON_NULL
spring.jackson.serialization.write-dates-as-timestamps=false
